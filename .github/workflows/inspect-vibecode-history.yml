name: Inspect Vibecode Vercel history

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-vibecode-history.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERCEL_TEAM_ID: team_UiBCzWjmTg1C1V8XgcYUT8Bd
    steps:
      - name: Inspect project history without mutating Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "NO_VERCEL_TOKEN"
            exit 2
          fi
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse
          token=os.environ['VERCEL_TOKEN']; team=os.environ['VERCEL_TEAM_ID']
          def get(path,query=None):
            url='https://api.vercel.com'+path
            if query:url+='?'+urllib.parse.urlencode(query)
            req=urllib.request.Request(url,headers={'Authorization':f'Bearer {token}','Accept':'application/json','User-Agent':'vibecode-history-inspector/1.0'})
            with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          p=get('/v9/projects/can-i-vibecode-it',{'teamId':team})
          print('PROJECT',json.dumps({'id':p.get('id'),'name':p.get('name'),'link':p.get('link'),'targets':p.get('targets')},default=str))
          pid=p.get('id')
          ds=get('/v6/deployments',{'teamId':team,'projectId':pid,'limit':100})
          arr=ds.get('deployments',[])
          print('DEPLOYMENT_COUNT',len(arr))
          for d in arr:
            print('DPL',json.dumps({k:d.get(k) for k in ['uid','name','url','state','created','target','meta']},default=str))
          PY
